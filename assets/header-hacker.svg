<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Yash Kamdar terminal banner">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Courier New',Courier,monospace}
    .rain{font-size:13px;fill:#00ff9c;opacity:.22}
    .r1{animation:fall 7s linear infinite}
    .r2{animation:fall 5s linear infinite -2s}
    .r3{animation:fall 9s linear infinite -4s}
    .r4{animation:fall 6s linear infinite -1s}
    @keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(260px)}}
    .cover{transform-box:fill-box;transform-origin:right center;animation:reveal 1.4s steps(19) .4s forwards}
    @keyframes reveal{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    .name{opacity:0;animation:show .1s steps(1) 2s forwards}
    .sub{opacity:0;animation:show .1s steps(1) 2.6s forwards}
    @keyframes show{to{opacity:1}}
    .gr{fill:#ff003c;opacity:.75;animation:g1 3.2s infinite steps(1) 3s}
    .gc{fill:#00e5ff;opacity:.75;animation:g2 3.2s infinite steps(1) 3s}
    .gm{fill:#00ff9c;animation:g3 3.2s infinite steps(1) 3s}
    @keyframes g1{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-6px,2px)}93%{transform:translate(5px,-3px)}95%{transform:translate(-3px,1px)}97%{transform:translate(0,0)}}
    @keyframes g2{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(6px,-2px)}93%{transform:translate(-5px,3px)}95%{transform:translate(3px,-1px)}97%{transform:translate(0,0)}}
    @keyframes g3{0%,91%,100%{transform:skewX(0)}92%{transform:skewX(-8deg)}94%{transform:skewX(6deg)}96%{transform:skewX(0)}}
    .cur{opacity:0;animation:blink 1s steps(1) infinite 3s}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .scan{animation:scan 4s linear infinite}
    @keyframes scan{from{transform:translateY(-50px)}to{transform:translateY(240px)}}
  </style>

  <rect x="1" y="1" width="898" height="238" rx="12" fill="#0a0f0c" stroke="#00ff9c" stroke-opacity=".45" stroke-width="2"/>

  <text class="rain r1" x="610" y="0"><tspan x="610" dy="16">1</tspan><tspan x="610" dy="16">0</tspan><tspan x="610" dy="16">1</tspan><tspan x="610" dy="16">1</tspan><tspan x="610" dy="16">0</tspan><tspan x="610" dy="16">1</tspan></text>
  <text class="rain r2" x="690" y="0"><tspan x="690" dy="16">0</tspan><tspan x="690" dy="16">1</tspan><tspan x="690" dy="16">0</tspan><tspan x="690" dy="16">0</tspan><tspan x="690" dy="16">1</tspan><tspan x="690" dy="16">1</tspan></text>
  <text class="rain r3" x="770" y="0"><tspan x="770" dy="16">1</tspan><tspan x="770" dy="16">1</tspan><tspan x="770" dy="16">0</tspan><tspan x="770" dy="16">1</tspan><tspan x="770" dy="16">0</tspan><tspan x="770" dy="16">0</tspan></text>
  <text class="rain r4" x="850" y="0"><tspan x="850" dy="16">0</tspan><tspan x="850" dy="16">1</tspan><tspan x="850" dy="16">1</tspan><tspan x="850" dy="16">0</tspan><tspan x="850" dy="16">1</tspan><tspan x="850" dy="16">0</tspan></text>

  <!-- title bar -->
  <path d="M1 13 a12 12 0 0 1 12 -12 h874 a12 12 0 0 1 12 12 v21 h-898z" fill="#0f1a14"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/><circle cx="46" cy="18" r="6" fill="#ffbd2e"/><circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" font-size="13" fill="#5f8f77">yash@virtual-realms: ~</text>

  <!-- typed command -->
  <text x="40" y="80" font-size="20" fill="#00ff9c">yash@realm:~$ whoami</text>
  <rect class="cover" x="38" y="60" width="270" height="26" fill="#0a0f0c"/>

  <!-- glitch name -->
  <g class="name" font-size="62" font-weight="bold">
    <text class="gr" x="40" y="150">YASH KAMDAR</text>
    <text class="gc" x="40" y="150">YASH KAMDAR</text>
    <text class="gm" x="40" y="150">YASH KAMDAR</text>
  </g>

  <text class="sub" x="40" y="196" font-size="18" fill="#7dffc8">&gt; 3D Artist &amp; Creative Developer</text>
  <rect class="cur" x="392" y="180" width="11" height="19" fill="#00ff9c"/>

  <rect class="scan" x="1" y="0" width="898" height="40" fill="url(#sc)"/>
</svg>
