<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Yash Kamdar cyberpunk terminal profile</title>
<desc id="desc">Animated cyberpunk terminal with glitch title, scanlines, matrix characters, particles and a typing introduction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090B14"/><stop offset=".55" stop-color="#111126"/><stop offset="1" stop-color="#07151D"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9B5CFF"/><stop offset=".5" stop-color="#00E5FF"/><stop offset="1" stop-color="#9B5CFF"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#6A6A9A" stroke-opacity=".12" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
    <path d="M0 5.5H4" stroke="#C7F7FF" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
  <clipPath id="screen"><rect x="12" y="12" width="976" height="546" rx="18"/></clipPath>
</defs>

<g clip-path="url(#screen)">
  <rect width="1000" height="570" fill="url(#bg)"/>
  <rect width="1000" height="570" fill="url(#grid)"/>
  <g opacity=".25" fill="#00E5FF" font-family="monospace" font-size="13">
    <text x="840" y="85"><tspan>010010</tspan><animate attributeName="y" values="85;530" dur="8s" repeatCount="indefinite"/></text>
    <text x="890" y="15"><tspan>101101</tspan><animate attributeName="y" values="15;550" dur="11s" repeatCount="indefinite"/></text>
    <text x="950" y="130"><tspan>110010</tspan><animate attributeName="y" values="130;560" dur="9s" repeatCount="indefinite"/></text>
    <text x="770" y="35"><tspan>001101</tspan><animate attributeName="y" values="35;560" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <g fill="#9B5CFF" opacity=".8">
    <circle cx="90" cy="420" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="130" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="490" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="12" y="12" width="976" height="546" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".9"/>
  <path d="M12 62H988" stroke="#8B7BFF" stroke-opacity=".55"/>
  <circle cx="39" cy="37" r="6" fill="#FF5F6D"/>
  <circle cx="61" cy="37" r="6" fill="#FFC857"/>
  <circle cx="83" cy="37" r="6" fill="#36D996"/>
  <text x="112" y="42" fill="#A9B5D0" font-family="monospace" font-size="15">yash1303@github: ~ / profile</text>
  <text x="850" y="42" fill="#36D996" font-family="monospace" font-size="12">● ONLINE</text>

  <text x="55" y="115" fill="#00E5FF" font-family="monospace" font-size="13" letter-spacing="3">IDENTITY // CREATIVE SYSTEMS</text>

  <g font-family="monospace" font-weight="700" font-size="58" letter-spacing="1">
    <text x="52" y="190" fill="#9B5CFF" opacity=".7">
      YASH KAMDAR_
      <animate attributeName="x" values="52;56;49;52" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="186" fill="#EAFBFF" filter="url(#glow)">YASH KAMDAR<tspan fill="#00E5FF">_</tspan>
      <animate attributeName="opacity" values="1;1;.82;1" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="54" y="225" fill="#B7A2FF" font-family="monospace" font-size="19" letter-spacing="2">GAME DEVELOPER / 3D ARTIST / WORLD BUILDER</text>

  <text x="55" y="278" fill="#00E5FF" font-family="monospace" font-size="15">&gt; whoami</text>
  <text x="55" y="307" fill="#D2D8EA" font-family="monospace" font-size="16">I create digital worlds and interactive experiences.</text>
  <text x="55" y="333" fill="#D2D8EA" font-family="monospace" font-size="16">Exploring the space between art, games and technology.</text>

  <text x="55" y="382" fill="#00E5FF" font-family="monospace" font-size="15">&gt; currently_exploring</text>
  <g font-family="monospace" font-size="14">
    <rect x="55" y="402" width="150" height="32" rx="5" fill="#171B32" stroke="#9B5CFF" stroke-opacity=".8"/>
    <text x="130" y="423" text-anchor="middle" fill="#D9C9FF">UNREAL ENGINE</text>
    <rect x="217" y="402" width="112" height="32" rx="5" fill="#101F2D" stroke="#00E5FF" stroke-opacity=".8"/>
    <text x="273" y="423" text-anchor="middle" fill="#A5F5FF">THREE.JS</text>
    <rect x="341" y="402" width="90" height="32" rx="5" fill="#171B32" stroke="#9B5CFF" stroke-opacity=".8"/>
    <text x="386" y="423" text-anchor="middle" fill="#D9C9FF">REACT</text>
    <rect x="443" y="402" width="75" height="32" rx="5" fill="#101F2D" stroke="#00E5FF" stroke-opacity=".8"/>
    <text x="480" y="423" text-anchor="middle" fill="#A5F5FF">C++</text>
    <rect x="530" y="402" width="120" height="32" rx="5" fill="#171B32" stroke="#9B5CFF" stroke-opacity=".8"/>
    <text x="590" y="423" text-anchor="middle" fill="#D9C9FF">AI SYSTEMS</text>
  </g>

  <path d="M55 468H945" stroke="#69749C" stroke-opacity=".45"/>
  <text x="55" y="505" fill="#9B5CFF" font-family="monospace" font-size="14">&gt;</text>
  <text x="78" y="505" fill="#EAFBFF" font-family="monospace" font-size="14">
    <tspan>building worlds, one experiment at a time</tspan>
    <animate attributeName="opacity" values="1;1;.25;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <rect x="55" y="521" width="9" height="17" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect width="1000" height="570" fill="url(#scan)" pointer-events="none"/>
</g>
</svg>
