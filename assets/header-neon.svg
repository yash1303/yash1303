<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Yash Kamdar neon banner">
  <defs>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgL" cx="0.1" cy="0.9" r="0.7"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".28"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgR" cx="0.9" cy="0.1" r="0.7"><stop offset="0" stop-color="#00f0ff" stop-opacity=".25"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="trk"><rect x="250" y="180" width="400" height="4"/></clipPath>
  </defs>
  <style>
    text{font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif}
    .flick{animation:flick 5s infinite}
    @keyframes flick{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,22%,24%,55%{opacity:.3}}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    .ring.rev{animation-direction:reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .p{fill:#fff;animation:rise 6s linear infinite}
    @keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.9}to{transform:translateY(-250px);opacity:0}}
    .sweep{animation:sweep 2.4s ease-in-out infinite alternate}
    @keyframes sweep{from{transform:translateX(250px)}to{transform:translateX(530px)}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <rect width="900" height="240" rx="14" fill="#05010f"/>
  <rect width="900" height="240" rx="14" fill="url(#bgL)"/>
  <rect width="900" height="240" rx="14" fill="url(#bgR)"/>
  <rect x="2" y="2" width="896" height="236" rx="13" fill="none" stroke="#ff2bd6" stroke-opacity=".5" stroke-width="1.5" filter="url(#glow2)"/>

  <circle class="ring" cx="90" cy="120" r="48" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="6 9" filter="url(#glow2)"/>
  <circle class="ring rev" cx="810" cy="120" r="48" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 9" filter="url(#glow2)"/>

  <circle class="p" cx="180" cy="236" r="2" style="animation-delay:-1s"/><circle class="p" cx="260" cy="236" r="1.5" style="animation-delay:-3s"/>
  <circle class="p" cx="340" cy="236" r="2" style="animation-delay:-5s"/><circle class="p" cx="450" cy="236" r="1.5" style="animation-delay:-2s"/>
  <circle class="p" cx="560" cy="236" r="2" style="animation-delay:-4s"/><circle class="p" cx="650" cy="236" r="1.5" style="animation-delay:-.5s"/>
  <circle class="p" cx="720" cy="236" r="2" style="animation-delay:-3.5s"/>

  <g class="flick" font-size="64" font-weight="800" letter-spacing="6" text-anchor="middle">
    <text x="447" y="120" fill="#ff2bd6" filter="url(#glow)" opacity=".8">YASH KAMDAR</text>
    <text x="450" y="118" fill="#00f0ff" filter="url(#glow)">YASH KAMDAR</text>
    <text x="450" y="118" fill="#e6feff">YASH KAMDAR</text>
  </g>

  <text x="450" y="158" text-anchor="middle" font-size="19" letter-spacing="7" fill="#ff8ae8" filter="url(#glow2)">3D ARTIST · CREATIVE DEVELOPER</text>

  <rect x="250" y="180" width="400" height="4" fill="#ffffff" opacity=".08"/>
  <g clip-path="url(#trk)"><rect class="sweep" x="0" y="180" width="120" height="4" fill="url(#bar)"/></g>

  <text class="pulse" x="450" y="216" text-anchor="middle" font-size="13" letter-spacing="10" fill="#00f0ff" filter="url(#glow2)">EXPLORING VIRTUAL REALMS</text>
</svg>
