name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build snake animations (one per theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-hacker.svg?color_snake=#00ff9c&color_dots=#0d1b14,#05583a,#08895c,#00c47c,#00ff9c
            dist/snake-retro.svg?color_snake=#ffe600&color_dots=#1d0e3d,#5a1f7a,#9a2d9a,#e03ab5,#ff4ecd
            dist/snake-neon.svg?color_snake=#00f0ff&color_dots=#120a2a,#2b1a5e,#5a2a9e,#b02bd6,#ff2bd6

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
